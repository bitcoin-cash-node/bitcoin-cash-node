---
name: "bitcoin-cash-node-osx"
enable_cache: true
distro: "ubuntu"
suites:
- "jammy"
architectures:
- "amd64"
packages:
- "autoconf"
- "automake"
- "bison"
- "bsdmainutils"
- "ca-certificates"
- "cmake"
- "curl"
- "faketime"
- "fonts-tuffy"
- "g++"
- "git"
- "help2man"
- "imagemagick"
- "libbz2-dev"
- "libcap-dev"
- "librsvg2-bin"
- "libtiff-tools"
- "libtinfo5"
- "libtool"
- "libz-dev"
- "lld"
- "llvm"
- "ninja-build"
- "pkg-config"
- "python3"
- "python3-dev"
- "python3-setuptools"
- "xorriso"
- "zip"
# Below are required to build libdispatch (needed for native-cctools)
- "libbsd-dev"
- "linux-libc-dev"
- "systemtap-sdt-dev"
# The following Debian package dependencies are needed only to build throwaway binaries to extract documentation from.
# To build the actual binaries for release, we instead compile dependencies ourselves for each target host.
- "libboost-chrono-dev"
- "libboost-date-time-dev"
- "libboost-filesystem-dev"
- "libboost-system-dev"
- "libboost-test-dev"
- "libdb-dev"
- "libdb++-dev"
- "libevent-dev"
- "libgmp-dev"
- "libminiupnpc-dev"
- "libprotobuf-dev"
- "libqrencode-dev"
- "libssl-dev"
- "libzmq3-dev"
- "protobuf-compiler"
- "qttools5-dev"
- "zlib1g-dev"
repositories:
- "distribution": "jammy"
  "source": "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
  keys:
  - server: "keyserver.ubuntu.com"
    recv:
    - "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
  packages:
  - "clang-18"
remotes:
- "url": "https://gitlab.com/bitcoin-cash-node/bitcoin-cash-node.git"
  "dir": "bitcoin"
files:
- "MacOSX14.5.sdk.tar.xz"
script: |
  # So that we can use clang-18, we must alias clang -> clang-18 using scripts in $HOME/bin
  mkdir -p $HOME/bin
  echo '#!/bin/bash' > $HOME/bin/clang
  echo 'exec clang-18 "$@"' >> $HOME/bin/clang
  chmod +x $HOME/bin/clang
  echo '#!/bin/bash' > $HOME/bin/clang++
  echo 'exec clang++-18 "$@"' >> $HOME/bin/clang++
  chmod +x $HOME/bin/clang++
  echo '#!/bin/bash' > $HOME/bin/clang-cpp
  echo 'exec clang-cpp-18 $"@"' >> $HOME/bin/clang-cpp
  chmod +x $HOME/bin/clang-cpp
  export PATH=$HOME/bin:${PATH}

  WRAP_DIR=$HOME/wrapped
  HOSTS="x86_64-apple-darwin23 aarch64-apple-darwin23"

  # CMake toolchain file name differ from host name
  declare -A CMAKE_TOOLCHAIN_FILE
  CMAKE_TOOLCHAIN_FILE[x86_64-apple-darwin23]=OSX.cmake
  CMAKE_TOOLCHAIN_FILE[aarch64-apple-darwin23]=OSX-arm64.cmake

  INSTALL_COMPONENTS="bitcoind bitcoin-qt bitcoin-seeder"

  FAKETIME_HOST_PROGS=""
  FAKETIME_PROGS="ar ranlib date"

  export QT_RCC_TEST=1
  export QT_RCC_SOURCE_DATE_OVERRIDE=1
  export GZIP="-9n"
  export TAR_OPTIONS="--mtime="$REFERENCE_DATE\\\ $REFERENCE_TIME""
  export TZ="UTC"
  export BUILD_DIR=`pwd`
  mkdir -p ${WRAP_DIR}
  if test -n "$GBUILD_CACHE_ENABLED"; then
    export SOURCES_PATH=${GBUILD_COMMON_CACHE}
    export BASE_CACHE=${GBUILD_PACKAGE_CACHE}
    mkdir -p ${BASE_CACHE} ${SOURCES_PATH}
  fi

  export ZERO_AR_DATE=1

  function create_global_faketime_wrappers {
  for prog in ${FAKETIME_PROGS}; do
    echo '#!/usr/bin/env bash' > ${WRAP_DIR}/${prog}
    echo "REAL=\`which -a ${prog} | grep -v ${WRAP_DIR}/${prog} | head -1\`" >> ${WRAP_DIR}/${prog}
    echo 'export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1' >> ${WRAP_DIR}/${prog}
    echo "export FAKETIME=\"$1\"" >> ${WRAP_DIR}/${prog}
    echo "\$REAL \$@" >> $WRAP_DIR/${prog}
    chmod +x ${WRAP_DIR}/${prog}
  done
  }

  function create_per-host_faketime_wrappers {
  for i in $HOSTS; do
    for prog in ${FAKETIME_HOST_PROGS}; do
        echo '#!/usr/bin/env bash' > ${WRAP_DIR}/${i}-${prog}
        echo "REAL=\`which -a ${i}-${prog} | grep -v ${WRAP_DIR}/${i}-${prog} | head -1\`" >> ${WRAP_DIR}/${i}-${prog}
        echo 'export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1' >> ${WRAP_DIR}/${i}-${prog}
        echo "export FAKETIME=\"$1\"" >> ${WRAP_DIR}/${i}-${prog}
        echo "\$REAL \$@" >> $WRAP_DIR/${i}-${prog}
        chmod +x ${WRAP_DIR}/${i}-${prog}
    done
  done
  }

  # Faketime for depends so intermediate results are comparable
  export PATH_orig=${PATH}
  create_global_faketime_wrappers "2000-01-01 12:00:00"
  create_per-host_faketime_wrappers "2000-01-01 12:00:00"
  export PATH=${WRAP_DIR}:${PATH}

  cd bitcoin
  SOURCEDIR=`pwd`
  BASEPREFIX=`pwd`/depends

  mkdir -p ${BASEPREFIX}/SDKs
  tar -C ${BASEPREFIX}/SDKs -xf ${BUILD_DIR}/MacOSX14.5.sdk.tar.xz

  # Build dependencies for each host
  for i in $HOSTS; do
    make ${MAKEOPTS} -C ${BASEPREFIX} HOST="${i}"
  done

  # Faketime for binaries
  export PATH=${PATH_orig}
  create_global_faketime_wrappers "${REFERENCE_DATETIME}"
  create_per-host_faketime_wrappers "${REFERENCE_DATETIME}"
  export PATH=${WRAP_DIR}:${PATH}
  # Transform "FAKETIME" into seconds from the epoch; SOURCE_DATE_EPOCH is used by the ninja osx-dmg target
  export SOURCE_DATE_EPOCH=`${WRAP_DIR}/date '+%s'`

  mkdir -p source_package
  pushd source_package
  cmake -GNinja .. \
    -DBUILD_LIBBITCOINCONSENSUS=OFF \
    -DENABLE_CLANG_TIDY=OFF \
    -DENABLE_NATPMP=OFF

  # Also generate manpages here, because they cannot be generated during cross-compilation
  ninja package_source doc-man
  SOURCEDIST=`echo bitcoin-cash-node-*.tar.gz`
  mv ${SOURCEDIST} ..
  mkdir ../doc/man
  mv doc/man/*.1 ../doc/man
  popd
  DISTNAME=`echo ${SOURCEDIST} | sed 's/.tar.*//'`

  # Correct tar file order
  mkdir -p temp
  pushd temp
  tar xf ../$SOURCEDIST
  find bitcoin-cash-node-* | sort | tar --no-recursion --mode='u+rw,go+r-w,a+X' --owner=0 --group=0 -c -T - | gzip -9n > ../$SOURCEDIST
  popd

  ORIGPATH="$PATH"
  # Create a build dir for each host and build
  for i in ${HOSTS}; do
    export PATH=${BASEPREFIX}/${i}/native/bin:${ORIGPATH}
    mkdir -p distsrc-${i}
    cd distsrc-${i}
    INSTALLPATH=`pwd`/installed/${DISTNAME}
    mkdir -p ${INSTALLPATH}

    cmake -GNinja .. \
      -DCMAKE_TOOLCHAIN_FILE=${SOURCEDIR}/cmake/platforms/${CMAKE_TOOLCHAIN_FILE[${i}]} \
      -DCLIENT_VERSION_IS_RELEASE=ON \
      -DENABLE_CLANG_TIDY=OFF \
      -DENABLE_REDUCE_EXPORTS=ON \
      -DCMAKE_INSTALL_PREFIX=${INSTALLPATH} \
      -DCCACHE=OFF

    ninja

    for _component in ${INSTALL_COMPONENTS}; do
       cmake -DCOMPONENT=${_component} -P cmake_install.cmake
    done

    export PYTHONPATH="${BASEPREFIX}/${i}/native/lib/python3/dist-packages:${PYTHONPATH}"
    ninja osx-deploydir

    OSX_VOLNAME="$(cat osx_volname)"
    mkdir -p unsigned-app-${i}
    cp osx_volname unsigned-app-${i}/
    cp ../contrib/macdeploy/detached-sig-apply.sh unsigned-app-${i}
    cp ../contrib/macdeploy/detached-sig-create.sh unsigned-app-${i}
    cp ${BASEPREFIX}/${i}/native/bin/${i}-codesign_allocate unsigned-app-${i}/codesign_allocate
    cp ${BASEPREFIX}/${i}/native/bin/${i}-pagestuff unsigned-app-${i}/pagestuff
    mv dist unsigned-app-${i}
    pushd unsigned-app-${i}
    find . | sort | tar --no-recursion --mode='u+rw,go+r-w,a+X' --owner=0 --group=0 -c -T - | gzip -9n > ${OUTDIR}/${DISTNAME}-${i}-unsigned.tar.gz
    popd

    ninja osx-dmg
    mv "${OSX_VOLNAME}.dmg" ${OUTDIR}/${DISTNAME}-${i}-unsigned.dmg

    cd installed
    # The install/strip target should do exactly that. However there is a bug in
    # in the Buster CMake version that causes strip to be called with the wrong
    # parameters when an Apple strip tool is used. This is fixed starting with
    # CMake versions >= 3.14, see:
    # https://gitlab.kitware.com/cmake/cmake/merge_requests/2892
    find -path "*.app*" -type f -executable -exec mv {} ${DISTNAME}/bin/bitcoin-qt \;
    find ${DISTNAME}/bin -type f -executable -exec ${i}-strip -u -r {} \;
    find ${DISTNAME}/lib -type f -executable -exec ${i}-strip -x {} \;
    find ${DISTNAME} -not -path "*.app*" | sort | tar --no-recursion --mode='u+rw,go+r-w,a+X' --owner=0 --group=0 -c -T - | gzip -9n > ${OUTDIR}/${DISTNAME}-${i}.tar.gz
    cd ../../
  done
  mkdir -p $OUTDIR/src
  mv $SOURCEDIST $OUTDIR/src
  mv ${OUTDIR}/${DISTNAME}-x86_64-apple-darwin23.tar.gz           ${OUTDIR}/${DISTNAME}-x86_64-apple-darwin.tar.gz
  mv ${OUTDIR}/${DISTNAME}-aarch64-apple-darwin23.tar.gz          ${OUTDIR}/${DISTNAME}-aarch64-apple-darwin.tar.gz
  mv ${OUTDIR}/${DISTNAME}-x86_64-apple-darwin23-unsigned.tar.gz  ${OUTDIR}/${DISTNAME}-x86_64-apple-darwin-unsigned.tar.gz
  mv ${OUTDIR}/${DISTNAME}-aarch64-apple-darwin23-unsigned.tar.gz ${OUTDIR}/${DISTNAME}-aarch64-apple-darwin-unsigned.tar.gz
  mv ${OUTDIR}/${DISTNAME}-x86_64-apple-darwin23-unsigned.dmg     ${OUTDIR}/${DISTNAME}-x86_64-apple-darwin-unsigned.dmg
  mv ${OUTDIR}/${DISTNAME}-aarch64-apple-darwin23-unsigned.dmg    ${OUTDIR}/${DISTNAME}-aarch64-apple-darwin-unsigned.dmg
